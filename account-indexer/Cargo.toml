[package]
name = "account-indexer"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "account-indexer-indexer"
path = "src/bin/indexer.rs"

[[bin]]
name = "account-indexer-api"
path = "src/bin/api.rs"

[dependencies]
async-trait = "0.1.92"
axum = { version = "0.8.3", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
dotenvy = "0.15.7"
inindexer = "8.0.0"
near-min-api = { version = "0.1.0", path = "../near-min-api" }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.9", features = ["postgres", "chrono", "runtime-tokio"] }
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6.2", features = ["cors"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
